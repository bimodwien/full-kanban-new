name: 🧪 CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [development, development-*]

jobs:
  lint-and-test:
    name: 🔍 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🗄️ Start test database
        run: |
          docker compose up -d database
          sleep 10

      - name: 🚀 Build API
        run: docker compose build api

      - name: 🌐 Build Web
        run: docker compose build web

      - name: � Start all services
        run: |
          docker compose up -d
          sleep 30

      - name: 🧪 Test API health
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8002/api; do sleep 2; done' || exit 1

      - name: 🌍 Test Web health
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3002; do sleep 2; done' || exit 1

      - name: 🔧 Run API tests (if exists)
        run: |
          # Only run if test script exists
          if docker compose exec api test -f package.json && docker compose exec api npm run --silent test 2>/dev/null; then
            echo "Running API tests..."
            docker compose exec api npm run test
          else
            echo "No API tests configured, skipping..."
          fi
        continue-on-error: true

      - name: 🎨 Run Web tests (if exists)
        run: |
          # Only run if test script exists  
          if docker compose exec web test -f package.json && docker compose exec web npm run --silent test 2>/dev/null; then
            echo "Running Web tests..."
            docker compose exec web npm run test
          else
            echo "No Web tests configured, skipping..."
          fi
        continue-on-error: true      - name: 🧹 Cleanup
        if: always()
        run: docker compose down -v

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
