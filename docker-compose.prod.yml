# Production Docker Compose
# Use this for deploying with CI/CD built images

version: '3.8'

networks:
  kanban-network:
    driver: bridge

volumes:
  kanban-db-data:

services:
  database:
    image: mysql:8.0
    container_name: kanban-database-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - '${DB_PORT:-3308}:3306'
    volumes:
      - kanban-db-data:/var/lib/mysql
    networks:
      - kanban-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  api:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/bimodwien/full-kanban-new/api:latest
    container_name: kanban-api-prod
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@kanban-database-prod:3306/${MYSQL_DATABASE}
      SECRET_KEY: ${SECRET_KEY}
      CLIENT_URL: ${CLIENT_URL}
      PORT: 8002
    ports:
      - '${API_PORT:-8002}:8002'
    networks:
      - kanban-network

  web:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/bimodwien/full-kanban-new/web:latest
    container_name: kanban-web-prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - '${WEB_PORT:-3002}:3002'
    networks:
      - kanban-network
